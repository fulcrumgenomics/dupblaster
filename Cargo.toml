[workspace]
# The root package (dupblaster) is the product; bench-compare is the
# benchmark-suite comparison tool. Both are workspace members so CI
# (cargo ci-test / ci-lint / ci-fmt, all run with --workspace) covers them.
members = ["bench-compare"]

[package]
name = "dupblaster"
version = "0.2.0"
authors = ["Tim Fennell <tim@fulcrumgenomics.com>"]
description = "Fast duplicate marking for query-grouped SAM/BAM files, inspired by samblaster and Picard MarkDuplicates"
edition = "2024"
rust-version = "1.89"
license = "MIT"
readme = "README.md"
homepage = "https://github.com/fulcrumgenomics/dupblaster"
repository = "https://github.com/fulcrumgenomics/dupblaster"
keywords = ["bioinformatics", "genomics", "sam", "bam", "duplicates"]
categories = ["science::bioinformatics", "command-line-utilities"]
# Ship only what's needed to build/use the crate; keep the benchmark, docs, and
# CI trees out of the published tarball (README images load from raw URLs).
exclude = ["/benchmark-pipeline", "/docs", "/.github"]

[[bin]]
name = "dupblaster"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bgzf = "0.4.0"
clap = { version = "4", features = ["derive", "wrap_help"] }
env_logger = "0.11"
fgoxide = "0.6"
fgumi-raw-bam = "0.2.0"
# Renders mate-CIGAR op lengths as decimal in the --add-mate-tags hot path.
# Already in the tree via kuva → svg2pdf → pdf-writer, so this adds no new crate.
itoa = "1.0"
kuva = { version = "0.4.0", features = ["pdf"] }
libc = "0.2"
libdeflater = "1.25"
log = "0.4"
memchr = "2"
mimalloc = { version = "0.1", default-features = false }
noodles-sam = "0.85"
rawb-io = "0.1"
# Hashes the tile dictionary's short packed keys (see src/tiles.rs). Already in
# the tree via the bench-compare workspace member, so this adds no new crate.
rustc-hash = "2"
# Only for `--read-name-format regex:<pattern>`, the escape hatch for platforms
# without a preset (see src/readname.rs). Already in the tree via env_logger →
# env_filter, so this adds no new crate; the feature set matches env_filter's
# plus `unicode-perl` so users can write `\d`/`\w` in a pattern. The case-folding,
# script, and segmentation tables stay off — read names are ASCII.
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-perl"] }
serde = { version = "1", features = ["derive"] }
tempfile = "3"
wide = "1.4"
# Compresses dupblaster's temporary files under --tmp-compression-level: the
# duplicate-split spill and the picard-exact orphan buffer.
# Chosen over the deflate implementations already in the tree (libdeflater via
# bgzf, and flate2) after measuring all three on a 333M-template spill: zstd
# compressed more for roughly half bgzf's CPU and a quarter of flate2's.
# `default-features = false` drops the legacy-format decoders and dictionary
# builder, which this only-reads-what-it-just-wrote use has no need to compile.
zstd = { version = "0.13.3", default-features = false }

[dev-dependencies]
# Test-only: read dupblaster's BAM output back for assertions without
# shelling out to `samtools`. noodles-util auto-detects SAM/BAM and yields
# RecordBufs (tag order normalized — fine for tests); noodles-bam's lazy
# reader is used where a test must see physically duplicate aux tags
# (RecordBuf de-dupes them). Versions track noodles-sam 0.85.
noodles-bam = "0.90"
noodles-util = { version = "0.80", features = ["alignment"] }

[profile.release]
lto = "fat"
codegen-units = 1
